  const uniq = a => [...new Set(a)];

  const closeAllMs = () => document.querySelectorAll(".ms-pop").forEach(p => { p.hidden = true; p.parentNode.querySelector(".ms-btn").setAttribute("aria-expanded", false); });
  Object.entries(TAGS).forEach(([id, g]) => {
    st[id] = [];
    const draw = () => { const q = norm($("#"+id+"Q").value.trim());
      $("#"+id+"List").innerHTML = g.tags.filter(o => !q || norm(o.k).includes(q)).map(o => `<label class="ms-opt"><input type="checkbox" value="${o.k}" ${st[id].includes(o.k)?"checked":""}><span class="ms-pill" style="background:${o.c};color:${o.t}">${o.k}</span></label>`).join("") || '<p class="ms-none">Không tìm thấy</p>'; };

  });
  st.locs = []; st.closed = [];
  const drawLocList = () => { const q = norm($("#locQ").value.trim());
    $("#locList").innerHTML = LOCOPTS.filter(o => !q || norm(o.k).includes(q)).map(o => `<label class="ms-opt"><input type="checkbox" value="${o.k}" ${st.locs.includes(o.k)?"checked":""}><span class="ms-pill" style="background:${o.c};color:${o.t}">${o.k}</span></label>`).join("") || '<p class="ms-none">Không tìm thấy</p>'; };
  const setLocVal = () => { $("#locVal").textContent = !st.locs.length ? "Tất cả địa điểm" : st.locs.length <= 2 ? st.locs.join(", ") : st.locs.length + " địa điểm"; $("#locMs").classList.toggle("set", st.locs.length > 0); };
  const openLoc = on => { $("#locPop").hidden = !on; $("#locBtn").setAttribute("aria-expanded", on); if(on){ $("#locQ").value = ""; drawLocList(); setTimeout(() => $("#locQ").focus(), 0); } };
  $("#locBtn").addEventListener("click", e => { e.stopPropagation(); const was = $("#locPop").hidden; closeAllMs(); openLoc(was); });
  $("#locPop").addEventListener("click", e => e.stopPropagation());
  $("#locQ").addEventListener("input", drawLocList);
  $("#locList").addEventListener("change", e => { const v = e.target.value; st.locs = e.target.checked ? [...st.locs, v] : st.locs.filter(x => x !== v); st.page = 1; setLocVal(); render(); });
  document.addEventListener("click", () => { openLoc(false); closeAllMs(); });
  document.addEventListener("keydown", e => { if(e.key === "Escape"){ openLoc(false); closeAllMs(); } });
  const DEPT_IC = { "":"grid", site:"gear", design:"cube", qs:"calc" };

  const h = location.hash.slice(1); if(DEPTS[h]) st.dept = h;
  try{ const s = JSON.parse(sessionStorage.getItem("ree_q") || "null"); if(s){ st.q = s.q || ""; st.loc = s.loc || ""; st.sys = s.sys || ""; sessionStorage.removeItem("ree_q"); } }catch(e){}

  const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();
  const salaryTop = j => Math.max(...(j.salary.match(/\d+/g) || [0]).map(Number));
  const match = (j, skip) => {
    if(st.q){ const hay = norm([j.title,j.en,j.code,j.summary,j.systems.join(" "),DEPTS[j.dept].name].join(" ")); if(!norm(st.q).split(/\s+/).every(w => hay.includes(w))) return false; }
    if(st.locs && st.locs.length && !st.locs.some(k => j.loc.split(" · ").includes(k))) return false;
    if(st.loc && !j.loc.includes(st.loc)) return false;
    if(skip !== "dept" && st.dept && j.dept !== st.dept) return false;
    if(skip !== "sys" && st.sys && !j.systems.includes(st.sys)) return false;
    if(st.sal.length && !st.sal.includes(j.salary)) return false;
    if(st.exp.length && !st.exp.includes(j.exp)) return false;
    if(st.en.length && !st.en.includes(j.english)) return false;
    return true;
  };
  const hl = html => { if(!st.q) return html; const w = norm(st.q).split(/\s+/).find(x => x.length > 1); if(!w) return html;
    return html.replace(/(<h3><a[^>]*>)([^<]+)(<\/a>)/, (m,a,t,c) => { const i = norm(t).indexOf(w); return i < 0 ? m : a + t.slice(0,i) + "<mark>" + t.slice(i,i+w.length) + "</mark>" + t.slice(i+w.length) + c; }); };

  /* grid card — only fields that exist in the data */
  const jxCard = j => `<article class="jx-card" data-jid="${j.id}">
      <header class="jxc-h"><div class="jxc-tt"><h3><a href="${jobURL(j)}">${j.title}</a></h3><span class="jxc-code">${j.code}</span></div>
        <button class="jxc-save" data-save="${j.id}" aria-pressed="${store.get("ree_saved", []).includes(j.id)}" aria-label="Lưu việc làm">${ic("bookmark")}</button></header>
      <div class="jxc-tags">${locPills(j)}${j.exp ? fieldPill("exp", j.exp) : ""}${j.english ? fieldPill("english", j.english) : ""}</div>
      ${(() => { const t = (j.descIntro || (j.desc || []).join(" · ")).replace(/<[^>]+>/g, "").trim(); return t ? `<p class="jxc-desc">${t}</p>` : ""; })()}
      <footer class="jxc-f"><span>Mức lương: <b>${j.salary}</b></span>${j.workTime ? `<span class="jxc-wt">${j.workTime}</span>` : ""}</footer>
      <a class="jxc-link" href="${jobURL(j)}" aria-hidden="true" tabindex="-1"></a>
    </article>`;
  function render(){
    $("#sort").value = st.sort;
    $("#vList").setAttribute("aria-pressed", st.view === "list"); $("#vGrid").setAttribute("aria-pressed", st.view === "grid");
    const bd = JOBS.filter(j => match(j, "dept"));
    $("#deptTabs").innerHTML = [["","Tất cả"], ...Object.entries(DEPTS).map(([k,d]) => [k, d.short])].map(([k,t]) => `<button type="button" class="sx-tab" role="tab" data-dept="${k}" aria-selected="${st.dept===k}">${ic(DEPT_IC[k] || "brief")}${t} <em>${k ? bd.filter(j=>j.dept===k).length : bd.length}</em></button>`).join("");
    $("#locRadios").innerHTML = [["","Tất cả địa điểm"], ...LOCS.map(l => [l,l])].map(([v,t]) => `<button type="button" class="sx-radio" role="radio" data-loc="${v}" aria-checked="${st.loc===v}"><i></i>${t}</button>`).join("");

    let res = JOBS.filter(j => match(j));
    const sorters = { hot:(a,b)=> (b.hot-a.hot) || a.deadline.localeCompare(b.deadline), deadline:(a,b)=>a.deadline.localeCompare(b.deadline), salary:(a,b)=>salaryTop(b)-salaryTop(a), az:(a,b)=>a.title.localeCompare(b.title,"vi") };
    res.sort(sorters[st.sort]);
    /* grouped by location, same order as the recruiting site; a job listed in several locations shows in each group */
    const list = $("#list"); list.className = "jgroups";
    const groups = LOC_TAGS.map(g => [g, res.filter(j => j.loc.split(" · ").includes(g.k))]).filter(([,a]) => a.length);
    list.innerHTML = groups.map(([g, a]) => { const open = !st.closed.includes(g.k);
      return `<section class="jg${open ? "" : " shut"}"><button type="button" class="jg-h" data-grp="${g.k}" aria-expanded="${open}"><svg class="jg-chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg><span class="loc-pill jg-pill" style="background:${g.c};color:${g.t}">${g.k}<span class="jg-n">${a.length}</span></span></button>
        <div class="${st.view === "list" ? "rows" : "job-grid"}"${open ? "" : " hidden"}>${a.map(j => hl(st.view === "list" ? jobRow(j).replace("<article class=\"jrow", `<article data-jid="${j.id}" class="jrow`) : jxCard(j))).join("")}</div></section>`; }).join("");
    $("#empty").hidden = res.length > 0; list.hidden = !res.length;
    const lbl = id => { const o = $(id).selectedOptions[0]; return o && o.value ? o.textContent : ""; };
    const active = [st.locs.join(", "), st.sal.join(", "), st.exp.join(", "), st.en.length && "Tiếng Anh: " + st.en.join(", ")].filter(Boolean);
    $("#resultText").innerHTML = `<b class="num">${res.length}</b> vị trí${active.length ? " · " + active.join(" · ") : " đang mở"}`;
    $("#pager").innerHTML = "";
  }

  const read = () => { st.page = 1; };
  $("#filterForm").addEventListener("submit", e => { e.preventDefault(); read(); render(); scrollTo({top: $(".toolbar").getBoundingClientRect().top + scrollY - 90, behavior:"smooth"}); });
  $("#sort").addEventListener("change", e => { st.sort = e.target.value; render(); });
  const setView = v => { st.view = v; store.set("ree_view", v); render(); };
  $("#vList").onclick = () => setView("list"); $("#vGrid").onclick = () => setView("grid");
  const reset = () => { Object.assign(st, { q:"", loc:"", locs:[], dept:"", lv:"", sys:"", sal:[], exp:[], en:[], page:1 }); setLocVal(); Object.values(TAGS).forEach(g => g.setVal()); render(); };
  $("#resetBtn").onclick = reset; $("#emptyReset").onclick = reset;
  document.addEventListener("click", e => {
    const c = e.target.closest("[data-dept]"); if(c){ st.dept = c.dataset.dept; st.page = 1; render(); return; }
    const lc = e.target.closest("[data-loc]"); if(lc){ st.loc = lc.dataset.loc; st.page = 1; render(); return; }
    const s = e.target.closest("[data-sysf]"); if(s){ st.sys = st.sys === s.dataset.sysf ? "" : s.dataset.sysf; st.page = 1; render(); return; }
    const gh = e.target.closest("[data-grp]"); if(gh){ const k = gh.dataset.grp; st.closed = st.closed.includes(k) ? st.closed.filter(x => x !== k) : [...st.closed, k]; render(); return; }
    const p = e.target.closest("[data-pg]"); if(p && !p.disabled){ st.page = +p.dataset.pg; render(); scrollTo({top: $(".toolbar").getBoundingClientRect().top + scrollY - 90, behavior:"smooth"}); }
  });
  addEventListener("hashchange", () => { const h = location.hash.slice(1); if(DEPTS[h]){ st.dept = h; st.page = 1; render(); } });

  /* ---- quick view (click a card / row) ---- */
  let qvList = [], qvIdx = -1;
  /* inside the site frame, raise the frame above the site header while the panel is open */
  /* modal on top of everything (iframe lifted above the site header); a static copy of the
     site header is drawn inside this page under the dimmed overlay so it still looks the same */
  let qvHdr = null;
  const qvHeaderCopy = on => {
    if(!on){ if(qvHdr) qvHdr.hidden = true; return; }
    const f = window.frameElement, pd = f && f.ownerDocument, h = pd && pd.querySelector("header"); if(!h) return;
    if(!qvHdr){
      qvHdr = document.createElement("div"); qvHdr.id = "qvHdr";
      qvHdr.style.cssText = "position:fixed;inset:0 0 auto 0;z-index:190;pointer-events:none";
      const sr = qvHdr.attachShadow({mode:"open"});
      pd.querySelectorAll('link[rel="stylesheet"]').forEach(l => { const n = document.createElement("link"); n.rel = "stylesheet"; n.href = l.href; sr.appendChild(n);
        if(/fonts\.googleapis/.test(l.href)) document.head.appendChild(n.cloneNode()); /* @font-face only works at document level */ });
      let vars = "", props = ""; const walk = rules => [...rules].forEach(r => { if(typeof CSSPropertyRule !== "undefined" && r instanceof pd.defaultView.CSSPropertyRule) props += r.cssText + "\n"; else if(r.cssRules && !r.selectorText) walk(r.cssRules); else if(r.selectorText && /(^|,)\s*:root\s*(,|$)/.test(r.selectorText) && !/:host/.test(r.selectorText)) vars += ":host{" + r.style.cssText + "}\n"; });
      try{ [...pd.styleSheets].forEach(ss => { try{ walk(ss.cssRules); }catch(_){} }); }catch(_){}
      if(props){ const ps = document.createElement("style"); ps.id = "qvHdrProps"; ps.textContent = props; document.head.appendChild(ps); } /* @property must be registered on the document, not in shadow DOM */
      const st = document.createElement("style"); st.textContent = vars + ":host{font-family:var(--font-sans);line-height:1.5;-webkit-font-smoothing:antialiased}"; sr.appendChild(st);
      const box = document.createElement("div"); box.className = "hc"; sr.appendChild(box);
      document.body.appendChild(qvHdr);
    }
    const c = h.cloneNode(true);
    c.querySelectorAll("img").forEach((im, k) => { const o = h.querySelectorAll("img")[k]; if(o) im.src = o.currentSrc || o.src; });
    c.querySelectorAll("aside, button.fixed").forEach(e => e.remove());
    c.style.top = Math.round(h.getBoundingClientRect().top - f.getBoundingClientRect().top) + "px";
    const box = qvHdr.shadowRoot.querySelector(".hc"); box.replaceChildren(c);
    qvHdr.hidden = false;
  };
  const qvLift = on => { try{
    const f = window.frameElement; if(!f) return;
    if(on){ qvHeaderCopy(true); f.style.zIndex = "2147483000"; }
    else { f.style.zIndex = "1"; qvHeaderCopy(false); }
  }catch(_){} };
  const qvShow = i => { qvIdx = i; const job = qvList[i]; if(!job) return;
    $("#qvBody").innerHTML = jobDetailHTML(job, `<a class="jx-btn" href="${jobURL(job)}" data-qv-apply>Ứng tuyển ngay${JX_EXT}</a>`);
    $("#qvBody").scrollTop = 0; $("#qvOpen").href = jobURL(job);
    $("#qvPrev").disabled = i <= 0; $("#qvNext").disabled = i >= qvList.length - 1; };
  const qvOpen = id => { const seen = new Set(); qvList = [...document.querySelectorAll("#list [data-jid]")].map(el => el.dataset.jid).filter(x => !seen.has(x) && seen.add(x)).map(x => JOBS.find(o => o.id === x));
    $("#qv").hidden = false; document.documentElement.style.overflow = "hidden"; qvLift(true); requestAnimationFrame(() => $("#qv").classList.add("on")); qvShow(qvList.findIndex(o => o.id === id)); };
  const qvClose = () => { $("#qv").classList.remove("on"); document.documentElement.style.overflow = ""; setTimeout(() => qvLift(false), 220); setTimeout(() => { $("#qv").hidden = true; }, 220); };
  document.addEventListener("click", e => {
    if(e.target.closest("[data-qv-close]")){ qvClose(); return; }
    if(e.target.closest("[data-qv-apply]")){ try{ sessionStorage.setItem("ree_apply", "1"); }catch(_){} return; }
    if(e.metaKey || e.ctrlKey || e.shiftKey || e.button) return;
    const card = e.target.closest("#list [data-jid]"); if(!card || e.target.closest("[data-save]")) return;
    e.preventDefault(); qvOpen(card.dataset.jid);
  }, true);
  $("#qvPrev").onclick = () => qvShow(qvIdx - 1); $("#qvNext").onclick = () => qvShow(qvIdx + 1);
  $("#qvPrint").onclick = () => { document.body.classList.add("qv-printing"); const done = () => { document.body.classList.remove("qv-printing"); removeEventListener("afterprint", done); }; addEventListener("afterprint", done); window.print(); setTimeout(done, 1500); };
  $("#qvCopy").onclick = () => { const u = new URL($("#qvOpen").getAttribute("href"), location.href).href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).catch(() => {}); const t = $("#qvToast"); t.hidden = false; clearTimeout(t._t); t._t = setTimeout(() => t.hidden = true, 1600); };
  { const b=$("#qvCopy"), lab=b.querySelector("span"), ico=b.querySelector("svg").innerHTML;
    b.addEventListener("click",()=>{ b.classList.add("ok"); lab.textContent="Đã sao chép"; b.dataset.l="Đã sao chép"; b.querySelector("svg").innerHTML='<path d="M5 12.5l4.5 4.5L19 7.5"/>'; clearTimeout(b._r); b._r=setTimeout(()=>{ b.classList.remove("ok"); lab.textContent="Sao chép link"; b.dataset.l="Sao chép link"; b.querySelector("svg").innerHTML=ico; },1800); }); }
  document.addEventListener("keydown", e => { if($("#qv").hidden) return; if(e.key === "Escape") qvClose(); if(e.key === "ArrowDown" || e.key === "ArrowRight"){ e.preventDefault(); qvShow(Math.min(qvIdx + 1, qvList.length - 1)); } if(e.key === "ArrowUp" || e.key === "ArrowLeft"){ e.preventDefault(); qvShow(Math.max(qvIdx - 1, 0)); } });
  render();
})();
</script>
</body>
</html>
